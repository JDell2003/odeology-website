  <text x="120" y="238" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.6" fill="#ffffff"><tspan x="120" dy="0">12 weeks of training and</tspan><tspan x="120" dy="68">recovery is the thing</tspan><tspan x="120" dy="68">falling apart</tspan></text>
  <text x="124" y="570" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26" font-weight="500" fill="#f2efff" opacity="0.95"><tspan x="124" dy="0">Training is fine in the moment, but</tspan><tspan x="124" dy="34">recovery is where I&apos;m slipping right now.</tspan><tspan x="124" dy="34">Biggest issue lately is sleeping badly on...</tspan></text>
