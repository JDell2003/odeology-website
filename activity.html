<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#140f0b">
  <script src="js/theme-color.js?v=2026-07-13-themebar-1" defer></script>
  <title>Move · RiseForIt</title>
  <link rel="stylesheet" href="css/main.css?v=2026-07-16-fabnav-2">
  <style>
    body.activity-page,
    :root[data-theme="light"] body.activity-page,
    :root[data-theme="dark"] body.activity-page {
      padding: 0 !important;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(59, 74, 102, 0.35), transparent 48%),
        linear-gradient(180deg, #0b0f18 0%, #06080e 55%, #030509 100%) !important;
      color: #fff;
      font-family: "Space Grotesk", sans-serif;
      overflow: auto !important;
    }
    body.activity-page .navbar,
    body.activity-page .control-panel,
    body.activity-page #control-mobile-fab-dock { display: none !important; }
    .mv-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 20px 40px;
      display: grid;
      align-content: start;
      gap: 18px;
      box-sizing: border-box;
    }
    .mv-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mv-back {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
    }
    .mv-gps {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }
    .mv-gps i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7a8699;
    }
    .mv-gps.is-good i { background: #65c786; box-shadow: 0 0 10px rgba(101, 199, 134, 0.7); }
    .mv-gps.is-poor i { background: #e5b070; }
    .mv-kind {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #10161f;
    }
    .mv-kind button {
      min-height: 38px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }
    .mv-kind button.is-active {
      background: linear-gradient(180deg, #2a3650, #1e2839);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
    }
    .mv-main {
      text-align: center;
      padding: 26px 0 8px;
    }
    .mv-distance {
      font-size: 4.6rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .mv-distance small {
      font-size: 1.1rem;
      color: #e5b070;
      letter-spacing: 0.1em;
      font-weight: 800;
    }
    .mv-substats {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mv-substat {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
    }
    .mv-substat b {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .mv-substat span {
      display: block;
      margin-top: 3px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }
    .mv-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mv-btn {
      min-height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(180deg, #1e2938, #161f2d);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }
    .mv-btn.is-primary {
      grid-column: 1 / -1;
      border-color: rgba(217, 161, 92, 0.55);
      background: linear-gradient(180deg, #d9a15c, #b9782d);
      color: #0c1119;
    }
    .mv-btn.is-danger { border-color: rgba(255, 143, 107, 0.4); color: #ff9d7d; }
    .mv-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .mv-btn.hidden { display: none; }
    .mv-status {
      min-height: 1.2em;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
    }
    .mv-status.is-good { color: #65c786; }
    .mv-status.is-bad { color: #ff9d7d; }
    .mv-card {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      padding: 16px;
      display: grid;
      gap: 10px;
    }
    .mv-card h2 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .mv-card p {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }
    .mv-card .mv-btn { min-height: 46px; font-size: 0.92rem; }
    .mv-gym-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mv-summary {
      display: none;
      text-align: center;
      border: 1px solid rgba(217, 161, 92, 0.4);
      border-radius: 18px;
      background: rgba(217, 161, 92, 0.08);
      padding: 18px;
    }
    .mv-summary.is-visible { display: block; }
    .mv-summary b { font-size: 1.3rem; }
    .mv-summary p { margin: 6px 0 0; font-size: 0.85rem; color: rgba(255, 255, 255, 0.65); }
  </style>
</head>
<body class="activity-page" data-require-auth="1">
  <main class="mv-shell">
    <div class="mv-top">
      <a class="mv-back" href="account.html">&larr; Account</a>
      <span class="mv-gps" id="mv-gps"><i></i><span id="mv-gps-label">GPS idle</span></span>
    </div>

    <div class="mv-kind" id="mv-kind">
      <button type="button" data-kind="walk" class="is-active">Walk</button>
      <button type="button" data-kind="run">Run</button>
      <button type="button" data-kind="ride">Ride</button>
    </div>

    <div class="mv-main">
      <div class="mv-distance"><span id="mv-distance">0.00</span> <small>MI</small></div>
      <div class="mv-substats">
        <div class="mv-substat"><b id="mv-time">0:00</b><span>Time</span></div>
        <div class="mv-substat"><b id="mv-pace">—</b><span>Pace /mi</span></div>
      </div>
    </div>

    <div class="mv-controls">
      <button type="button" class="mv-btn is-primary" id="mv-start">Start</button>
      <button type="button" class="mv-btn hidden" id="mv-pause">Pause</button>
      <button type="button" class="mv-btn is-danger hidden" id="mv-finish">Finish</button>
    </div>
    <div class="mv-status" id="mv-status">Keep this screen open while tracking — the browser pauses GPS when the phone locks.</div>

    <div class="mv-summary" id="mv-summary"></div>

    <div class="mv-card">
      <h2>Gym check-in</h2>
      <p id="mv-gym-copy">Check in when you arrive — being within 0.1 miles of your saved gym earns consistency points.</p>
      <div class="mv-gym-row">
        <button type="button" class="mv-btn" id="mv-checkin">Check in at gym</button>
        <button type="button" class="mv-btn" id="mv-setgym">Set my gym here</button>
      </div>
      <div class="mv-status" id="mv-gym-status"></div>
    </div>
  </main>

  <script src="js/main.js?v=2026-07-19-roles-1"></script>
  <script>
  (() => {
    const $ = (sel) => document.querySelector(sel);
    const state = {
      kind: 'walk',
      running: false,
      paused: false,
      startedAt: 0,
      elapsedBeforePause: 0,
      distanceMeters: 0,
      lastFix: null,
      watchId: null,
      wakeLock: null,
      tickTimer: null
    };

    const METERS_PER_MILE = 1609.344;

    function haversine(lat1, lng1, lat2, lng2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function elapsedSeconds() {
      if (!state.running) return state.elapsedBeforePause;
      return state.elapsedBeforePause + (state.paused ? 0 : (Date.now() - state.startedAt) / 1000);
    }

    function fmtTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
    }

    function render() {
      const miles = state.distanceMeters / METERS_PER_MILE;
      $('#mv-distance').textContent = miles.toFixed(2);
      const secs = elapsedSeconds();
      $('#mv-time').textContent = fmtTime(secs);
      if (miles >= 0.05 && secs > 30) {
        const paceSec = secs / miles;
        $('#mv-pace').textContent = `${Math.floor(paceSec / 60)}:${String(Math.round(paceSec % 60)).padStart(2, '0')}`;
      } else {
        $('#mv-pace').textContent = '—';
      }
    }

    function setGpsQuality(accuracy) {
      const el = $('#mv-gps');
      const label = $('#mv-gps-label');
      el.classList.remove('is-good', 'is-poor');
      if (!Number.isFinite(accuracy)) { label.textContent = 'GPS idle'; return; }
      if (accuracy <= 25) { el.classList.add('is-good'); label.textContent = `GPS ±${Math.round(accuracy)}m`; }
      else { el.classList.add('is-poor'); label.textContent = `GPS weak ±${Math.round(accuracy)}m`; }
    }

    function onFix(position) {
      const { latitude, longitude, accuracy } = position.coords;
      setGpsQuality(accuracy);
      if (!state.running || state.paused) return;
      if (accuracy > 50) return; // ignore junk fixes
      if (state.lastFix) {
        const segment = haversine(state.lastFix.lat, state.lastFix.lng, latitude, longitude);
        // Ignore GPS jitter smaller than the noise floor.
        if (segment >= Math.max(3, accuracy * 0.35) && segment < 300) {
          state.distanceMeters += segment;
        }
      }
      state.lastFix = { lat: latitude, lng: longitude };
      render();
    }

    async function keepAwake() {
      try {
        state.wakeLock = await navigator.wakeLock?.request('screen');
        state.wakeLock?.addEventListener('release', () => { state.wakeLock = null; });
      } catch { /* not supported / denied */ }
    }

    function setStatus(message, tone = '') {
      const el = $('#mv-status');
      el.textContent = message;
      el.className = `mv-status${tone ? ` is-${tone}` : ''}`;
    }

    function start() {
      if (!navigator.geolocation) {
        setStatus('This browser has no GPS support.', 'bad');
        return;
      }
      state.running = true;
      state.paused = false;
      state.startedAt = Date.now();
      state.lastFix = null;
      $('#mv-start').classList.add('hidden');
      $('#mv-pause').classList.remove('hidden');
      $('#mv-finish').classList.remove('hidden');
      $('#mv-summary').classList.remove('is-visible');
      setStatus('Tracking — keep the screen on.');
      keepAwake();
      state.watchId = navigator.geolocation.watchPosition(onFix, (err) => {
        setStatus(err.code === 1 ? 'Location permission denied — allow it to track distance.' : 'GPS signal lost, retrying…', 'bad');
      }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
      state.tickTimer = setInterval(render, 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.running) keepAwake();
      });
    }

    function pauseResume() {
      if (!state.running) return;
      if (!state.paused) {
        state.elapsedBeforePause = elapsedSeconds();
        state.paused = true;
        state.lastFix = null;
        $('#mv-pause').textContent = 'Resume';
        setStatus('Paused.');
      } else {
        state.paused = false;
        state.startedAt = Date.now();
        $('#mv-pause').textContent = 'Pause';
        setStatus('Tracking — keep the screen on.');
      }
    }

    async function finish() {
      const durationSeconds = Math.round(elapsedSeconds());
      const distanceMeters = Math.round(state.distanceMeters);
      state.running = false;
      state.paused = false;
      state.elapsedBeforePause = 0;
      if (state.watchId !== null) navigator.geolocation.clearWatch(state.watchId);
      if (state.tickTimer) clearInterval(state.tickTimer);
      try { state.wakeLock?.release(); } catch { /* ignore */ }
      $('#mv-start').classList.remove('hidden');
      $('#mv-pause').classList.add('hidden');
      $('#mv-pause').textContent = 'Pause';
      $('#mv-finish').classList.add('hidden');

      const miles = (distanceMeters / METERS_PER_MILE).toFixed(2);
      if (durationSeconds < 30) {
        setStatus('Session under 30 seconds — not saved.', 'bad');
        state.distanceMeters = 0;
        render();
        return;
      }
      setStatus('Saving session…');
      try {
        const resp = await fetch('/api/health/activity', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kind: state.kind, durationSeconds, distanceMeters })
        });
        const json = await resp.json().catch(() => ({}));
        if (resp.ok && json.ok) {
          const summary = $('#mv-summary');
          summary.innerHTML = `<b>${miles} mi ${state.kind}</b><p>${fmtTime(durationSeconds)} · saved to your health log. Keep stacking days.</p>`;
          summary.classList.add('is-visible');
          setStatus('Saved.', 'good');
        } else {
          setStatus(json.error || 'Could not save the session.', 'bad');
        }
      } catch {
        setStatus('Could not reach the server — session not saved.', 'bad');
      }
      state.distanceMeters = 0;
      render();
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('no gps'));
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
      });
    }

    function setGymStatus(message, tone = '') {
      const el = $('#mv-gym-status');
      el.textContent = message;
      el.className = `mv-status${tone ? ` is-${tone}` : ''}`;
    }

    $('#mv-checkin').addEventListener('click', async () => {
      setGymStatus('Getting your location…');
      try {
        const pos = await getPosition();
        const resp = await fetch('/api/health/gym-checkin', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          })
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok || !json.ok) return setGymStatus(json.error || 'Check-in failed.', 'bad');
        if (!json.hasGym) return setGymStatus('No gym saved yet — stand at your gym and tap "Set my gym here" first.', 'bad');
        if (json.within) return setGymStatus(`Checked in at ${json.gymName} — +10 consistency points.`, 'good');
        const miles = (json.distanceMeters / METERS_PER_MILE).toFixed(2);
        setGymStatus(`You are ${miles} mi from ${json.gymName} — get within 0.1 mi to check in.`, 'bad');
      } catch {
        setGymStatus('Could not get your location — allow location access.', 'bad');
      }
    });

    $('#mv-setgym').addEventListener('click', async () => {
      const name = window.prompt('Name this gym:', 'My gym');
      if (name === null) return;
      setGymStatus('Saving gym location…');
      try {
        const pos = await getPosition();
        const resp = await fetch('/api/profile', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            profile: {
              health: {
                gym: {
                  name: String(name || 'My gym').slice(0, 60),
                  lat: pos.coords.latitude,
                  lng: pos.coords.longitude,
                  setAt: new Date().toISOString()
                }
              }
            }
          })
        });
        const json = await resp.json().catch(() => ({}));
        if (resp.ok) setGymStatus(`Gym saved${json ? '' : ''} — future check-ins measure against this spot.`, 'good');
        else setGymStatus('Could not save the gym location.', 'bad');
      } catch {
        setGymStatus('Could not get your location — allow location access.', 'bad');
      }
    });

    document.querySelectorAll('#mv-kind button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#mv-kind button').forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        state.kind = btn.dataset.kind;
      });
    });
    $('#mv-start').addEventListener('click', start);
    $('#mv-pause').addEventListener('click', pauseResume);
    $('#mv-finish').addEventListener('click', finish);
    render();
  })();
  </script>
</body>
</html>
