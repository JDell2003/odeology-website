<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseForIt Chat Widget Verification</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4efe7;
            --panel: rgba(255, 255, 255, 0.92);
            --text: #13212d;
            --muted: #5a6773;
            --accent: #0b7a75;
            --border: rgba(19, 33, 45, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(11, 122, 117, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(214, 161, 73, 0.2), transparent 34%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(680px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(19, 33, 45, 0.12);
            padding: 32px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1;
        }

        p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .pill {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(11, 122, 117, 0.1);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <main>
        <div class="pill">Widget Verification</div>
        <h1>RiseForIt chat widget</h1>
        <p>This page exists only to host the LeadConnector chat widget on a clean page without other phone or SMS opt-in forms.</p>
        <p>If the widget does not appear immediately, wait a few seconds for the external script to load.</p>
    </main>
    <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a20c3c31ce15bb9e9817a80" data-source="WEB_USER"></script>
</body>
</html>
