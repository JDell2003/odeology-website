<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mouth detector</title></head>
<body>
<script type="module">
  import { FaceDetector, PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  window.faceDetector = await FaceDetector.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'
    },
    runningMode: 'IMAGE',
    minDetectionConfidence: 0.3
  });
  // Pose handles stylized/helmeted characters that the face model misses.
  // Landmarks: 0 nose, 9/10 mouth corners, 11/12 shoulders.
  window.poseDetector = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
    },
    runningMode: 'IMAGE',
    numPoses: 3,
    minPoseDetectionConfidence: 0.3
  });
  window.detectImage = async (url) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url;
    await img.decode();
    const faces = (window.faceDetector.detect(img).detections || []).map((d) => ({
      src: 'face',
      score: d.categories?.[0]?.score || 0,
      bw: d.boundingBox.width / img.naturalWidth,
      bh: d.boundingBox.height / img.naturalHeight,
      mouth: d.keypoints?.[3] ? { x: d.keypoints[3].x, y: d.keypoints[3].y } : null
    })).filter((f) => f.mouth);
    const poseRes = window.poseDetector.detect(img);
    const poses = (poseRes.landmarks || []).map((lm) => {
      const m9 = lm[9], m10 = lm[10], nose = lm[0], ls = lm[11], rs = lm[12];
      if (!m9 || !m10) return null;
      const vis = Math.min(m9.visibility ?? 1, m10.visibility ?? 1);
      const shoulderW = (ls && rs) ? Math.abs(ls.x - rs.x) : 0.1;
      return {
        src: 'pose',
        score: Number(vis.toFixed(3)),
        bw: Math.max(0.02, shoulderW),
        bh: Math.max(0.02, shoulderW * 1.2),
        mouth: { x: (m9.x + m10.x) / 2, y: (m9.y + m10.y) / 2 },
        nose: nose ? { x: nose.x, y: nose.y } : null
      };
    }).filter(Boolean).filter((p) => p.score >= 0.35);
    return { w: img.naturalWidth, h: img.naturalHeight, detections: [...faces, ...poses] };
  };
  window.ready = true;
</script>
</body>
</html>
