<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140f0b">
  <script src="js/theme-color.js?v=2026-07-13-themebar-1" defer></script>
  <title>Content Program · RiseForIt</title>
  <link rel="stylesheet" href="css/main.css?v=2026-07-16-fabnav-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body.content-page {
      background:
        radial-gradient(circle at 8% -4%, rgba(197, 141, 79, 0.16), transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
    }
    .cp-wrap {
      width: min(680px, calc(100vw - 24px));
      margin: 0 auto;
      padding: calc(var(--navbar-height, 72px) + 12px) 0 96px;
    }
    .cp-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.36rem 0.72rem; border-radius: 999px;
      background: var(--accent-soft); border: 1px solid rgba(197,141,79,.34);
      color: var(--accent); font-size: 0.66rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase; font-family: var(--font-body);
    }
    .cp-h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1.02; letter-spacing: -0.02em; margin: 12px 0 0; }
    .cp-sub { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

    /* generic card */
    .cp-card { border-radius: var(--radius-md, 18px); border: 1px solid var(--line); background: var(--card); padding: 16px; margin-top: 14px; }
    .cp-card.pad0 { padding: 0; overflow: hidden; }
    .cp-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

    /* buttons */
    .cp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 13px; font-family: var(--font-body); font-size: 1rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; width: 100%; transition: filter .14s ease, transform .12s ease; }
    .cp-btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #1c1206; box-shadow: 0 12px 26px rgba(197,141,79,.28); }
    .cp-btn-primary:hover { filter: brightness(1.05); }
    .cp-btn-primary:active { transform: translateY(1px); }
    .cp-btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
    .cp-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .cp-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .cp-btn[disabled] { opacity: .5; cursor: not-allowed; }
    .cp-btn.sm { min-height: 44px; font-size: 0.86rem; padding: 0 14px; width: auto; }

    /* questionnaire */
    .cp-q { margin-top: 16px; }
    .cp-q h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0 0 2px; }
    .cp-q .cp-ask { color: var(--ink); font-weight: 700; font-size: 1.02rem; margin: 0 0 4px; }
    .cp-q .cp-help { color: var(--muted); font-size: 0.85rem; line-height: 1.45; margin: 0 0 12px; }
    .cp-input, .cp-textarea { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-family: var(--font-body); font-size: 1rem; font-weight: 500; outline: none; }
    .cp-textarea { min-height: 74px; resize: vertical; line-height: 1.45; }
    .cp-input:focus, .cp-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .cp-field + .cp-field { margin-top: 12px; }
    .cp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .cp-chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 8px 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .cp-chip:hover { border-color: var(--accent); color: var(--accent); }
    .cp-goodbad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
    .cp-gb { border-radius: 10px; padding: 9px 11px; font-size: 0.8rem; line-height: 1.35; border: 1px solid var(--line); }
    .cp-gb.good { border-color: rgba(74,222,128,.4); } .cp-gb.good b { color: #4ade80; }
    .cp-gb.bad { border-color: rgba(248,113,113,.4); } .cp-gb.bad b { color: #f87171; }
    .cp-err { color: #f87171; font-size: 0.82rem; font-weight: 700; margin-top: 6px; min-height: 1em; }
    .cp-daysel { display: flex; gap: 6px; flex-wrap: wrap; }
    .cp-day { flex: 1 1 auto; min-width: 48px; min-height: 48px; text-align: center; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 10px; padding: 13px 4px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
    .cp-day.on { background: var(--accent); border-color: var(--accent); color: #1c1206; }
    .cp-seg { display: flex; gap: 6px; }
    .cp-seg button { flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 10px; padding: 11px 4px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .cp-seg button.on { background: var(--accent); border-color: var(--accent); color: #1c1206; }
    .cp-progress { display: flex; gap: 5px; margin: 14px 0 4px; }
    .cp-progress i { height: 4px; flex: 1; border-radius: 99px; background: var(--line); }
    .cp-progress i.on { background: var(--accent); }

    /* today card */
    .cp-today { border-radius: var(--radius-lg, 26px); border: 1px solid rgba(197,141,79,.3); background: radial-gradient(circle at 100% 0%, rgba(197,141,79,.1), transparent 45%), var(--panel); box-shadow: var(--shadow); overflow: hidden; margin-top: 14px; }
    .cp-today-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .cp-today-date { font-size: 0.74rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .cp-jobtag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 0.74rem; font-weight: 900; letter-spacing: .04em; }
    .cp-jobtag.win { background: rgba(74,222,128,.16); color: #4ade80; }
    .cp-jobtag.mistake { background: rgba(248,113,113,.15); color: #f87171; }
    .cp-jobtag.app { background: var(--accent-soft); color: var(--accent); }
    .cp-jobtag.rest { background: rgba(255,255,255,.08); color: var(--muted); }
    .cp-jobtag.stories { background: rgba(129,140,248,.16); color: #a5b4fc; }
    .cp-today-body { padding: 16px 18px; }
    .cp-jobtitle { font-family: var(--font-display); font-weight: 900; font-size: 1.45rem; margin: 0; }
    .cp-prompt { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid rgba(197,141,79,.28); color: var(--ink); font-size: 0.86rem; line-height: 1.45; }
    .cp-prompt b { color: var(--accent); }
    .cp-script { margin: 12px 0 0; padding: 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); white-space: pre-wrap; font-size: 0.98rem; line-height: 1.6; font-weight: 500; }
    .cp-hooknote { margin-top: 8px; font-size: 0.78rem; color: var(--muted); line-height: 1.4; font-style: italic; }
    .cp-copyrow { display: grid; gap: 8px; margin-top: 12px; }
    .cp-cta-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px dashed rgba(197,141,79,.4); background: var(--accent-soft); }
    .cp-cta-box .cp-label { color: var(--accent); }
    .cp-cta-text { margin: 6px 0 0; font-size: 0.94rem; line-height: 1.5; font-weight: 600; }
    .cp-cta-why { margin-top: 6px; font-size: 0.74rem; color: var(--muted); }
    .cp-iposted { margin-top: 14px; }

    /* stories */
    .cp-stories { margin-top: 12px; }
    .cp-story { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: var(--card); }
    .cp-story-n { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 900; font-size: 0.8rem; }
    .cp-story-txt { min-width: 0; }
    .cp-story-slot { font-size: 0.66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .cp-story-line { font-size: 0.92rem; line-height: 1.45; margin-top: 2px; }
    .cp-story-check { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-weight: 900; cursor: pointer; flex: 0 0 auto; }
    .cp-story-check.done { background: #16a34a; border-color: #16a34a; color: #fff; }

    /* week strip */
    .cp-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 64px; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
    .cp-day-cell { scroll-snap-align: start; border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; background: var(--card); cursor: default; position: relative; }
    .cp-day-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cp-day-cell.editable { cursor: pointer; }
    .cp-dc-dow { font-size: 0.62rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .cp-dc-date { font-size: 1.1rem; font-weight: 900; margin: 1px 0; }
    .cp-dc-job { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
    .cp-dc-job.win { color: #4ade80; } .cp-dc-job.mistake { color: #f87171; } .cp-dc-job.app { color: var(--accent); } .cp-dc-job.rest { color: var(--muted); } .cp-dc-job.stories { color: #a5b4fc; }
    .cp-dc-dot { width: 7px; height: 7px; border-radius: 99px; margin: 5px auto 0; background: var(--line); }
    .cp-dc-dot.done { background: #4ade80; } .cp-dc-dot.missed { background: #f87171; } .cp-dc-dot.upcoming { background: var(--muted); opacity: .5; }
    .cp-dc-pencil { position: absolute; top: 3px; right: 4px; font-size: 0.66rem; opacity: .5; }

    /* compliance */
    .cp-score-num { font-family: var(--font-display); font-weight: 900; font-size: 2.8rem; line-height: 1; }
    .cp-score.green .cp-score-num { color: #4ade80; } .cp-score.amber .cp-score-num { color: #f5b942; } .cp-score.red .cp-score-num { color: #f87171; }
    .cp-band { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; margin-left: 8px; }
    .cp-score.green .cp-band { background: rgba(74,222,128,.16); color: #4ade80; } .cp-score.amber .cp-band { background: rgba(245,185,66,.16); color: #f5b942; } .cp-score.red .cp-band { background: rgba(248,113,113,.16); color: #f87171; }
    .cp-score-row { display: flex; gap: 18px; align-items: flex-end; }
    .cp-score-30 { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
    .cp-note { color: var(--muted); font-size: 0.84rem; line-height: 1.5; margin-top: 10px; }

    /* modal (edit flow / check-in) */
    .cp-modal { position: fixed; inset: 0; z-index: 500; display: grid; place-items: end center; padding: 0; background: rgba(4,6,10,.6); }
    .cp-modal[hidden] { display: none; }
    .cp-modal-card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -20px 50px rgba(0,0,0,.4); max-height: 88vh; overflow-y: auto; }
    @media (min-width: 560px) { .cp-modal { place-items: center; } .cp-modal-card { border-radius: 22px; } }
    .cp-modal-card h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; margin: 0 0 4px; }

    .cp-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 600; background: #16a34a; color: #fff; font-weight: 800; font-size: 0.9rem; padding: 11px 18px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .cp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .cp-unlock { border-color: rgba(245,185,66,.5); background: radial-gradient(circle at 100% 0%, rgba(245,185,66,.12), transparent 46%), var(--card); }

    .cp-section-title { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 22px 0 0; }
    .cp-linkrow { display: flex; gap: 8px; align-items: center; }
    .cp-linkrow input { flex: 1; }

    /* ============ v4: mobile-first one-question-per-screen ============ */
    .cp-wrap.flow { padding-bottom: 0; min-height: 100dvh; }
    .cp-screen { display: flex; flex-direction: column; min-height: calc(100dvh - var(--navbar-height, 72px) - 12px); }
    .cp-screen-top { position: sticky; top: 0; z-index: 3; background: linear-gradient(var(--bg) 70%, transparent); padding-top: 4px; }
    .cp-flowbar { display: flex; align-items: center; gap: 12px; min-height: 40px; }
    .cp-back { background: none; border: 0; color: var(--muted); font-size: 0.9rem; font-weight: 700; cursor: pointer; padding: 8px 4px; min-height: 44px; }
    .cp-back:hover { color: var(--accent); }
    .cp-bar { flex: 1; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .cp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
    .cp-screen-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-start; padding: 18px 0 8px; }
    .cp-seclabel { font-size: 0.68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .cp-qh { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; line-height: 1.08; letter-spacing: -0.01em; margin: 8px 0 0; }
    @media (min-width: 640px) { .cp-qh { font-size: clamp(1.5rem, 3.4vw, 2.6rem); } .cp-screen { min-height: 70vh; } }
    .cp-qsub { color: var(--muted); font-size: 1rem; line-height: 1.5; margin: 8px 0 0; }
    .cp-lesson { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 0.9rem; line-height: 1.45; color: var(--ink); }
    .cp-example { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; font-style: italic; }
    .cp-example b { color: var(--ink); font-style: normal; font-weight: 600; }
    .cp-why-open { display: inline-block; margin-top: 12px; background: none; border: 0; color: var(--accent); font-size: 0.9rem; font-weight: 700; cursor: pointer; padding: 6px 0; }
    .cp-blank { margin-top: 12px; font-size: 1.05rem; color: var(--muted); font-weight: 600; }
    .cp-blank-slot { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: 800; }
    .cp-preview { margin-top: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.3; color: var(--ink); min-height: 1.2em; }
    .cp-qinput { margin-top: 14px; }
    .cp-qinput .cp-input, .cp-qinput .cp-textarea { font-size: 16px; min-height: 54px; }
    .cp-qinput .cp-textarea { min-height: 92px; }
    .cp-choices { display: grid; gap: 10px; margin-top: 14px; }
    .cp-choice { min-height: 56px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 1rem; font-weight: 700; text-align: left; cursor: pointer; }
    .cp-choice:hover { border-color: var(--accent); }
    .cp-choice.on { background: var(--accent); border-color: var(--accent); color: #1c1206; }
    .cp-suggest { margin-top: 8px; }
    .cp-chipwrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .cp-chip2 { min-height: 48px; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .cp-chip2:hover { border-color: var(--accent); color: var(--accent); }
    .cp-hookprev { margin-top: 14px; border: 1px solid rgba(197,141,79,.3); background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    .cp-hookprev .cp-label { color: var(--accent); }
    .cp-hookprev-line { margin-top: 4px; font-size: 0.92rem; line-height: 1.4; font-weight: 600; }
    .cp-sticky { position: sticky; bottom: 0; z-index: 3; background: linear-gradient(transparent, var(--bg) 30%); padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
    .cp-sticky .cp-btn { min-height: 56px; }

    /* path chooser + section intro + day zero */
    .cp-pathcard { border-radius: var(--radius-lg, 24px); border: 1px solid var(--line); background: var(--card); padding: 18px; margin-top: 12px; cursor: pointer; }
    .cp-pathcard:hover { border-color: var(--accent); }
    .cp-pathcard.reco { border-color: rgba(197,141,79,.45); background: radial-gradient(circle at 100% 0%, rgba(197,141,79,.1), transparent 46%), var(--card); }
    .cp-pathcard h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; margin: 0; display: flex; align-items: baseline; gap: 8px; }
    .cp-pathcard .meta { color: var(--accent); font-size: 0.82rem; font-weight: 700; }
    .cp-pathcard p { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 8px 0 0; }
    .cp-intro { display: flex; flex-direction: column; justify-content: center; min-height: calc(100dvh - var(--navbar-height, 72px) - 40px); text-align: left; }
    .cp-intro .cp-seclabel { font-size: 0.72rem; }
    .cp-intro h2 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.04; margin: 10px 0 0; }
    .cp-intro p { color: var(--muted); font-size: 1.05rem; line-height: 1.55; margin: 14px 0 0; max-width: 32ch; }

    /* Day Zero */
    .cp-dz-task { border: 1px solid var(--line); border-radius: 14px; background: var(--card); margin-top: 10px; overflow: hidden; }
    .cp-dz-head { display: flex; gap: 12px; align-items: center; padding: 14px 14px; cursor: pointer; }
    .cp-dz-check { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; border: 2px solid var(--line); background: transparent; color: transparent; display: grid; place-items: center; font-weight: 900; }
    .cp-dz-task.done .cp-dz-check { background: #16a34a; border-color: #16a34a; color: #fff; }
    .cp-dz-title { font-weight: 800; font-size: 1rem; }
    .cp-dz-body { padding: 0 14px 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .cp-dz-pin { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--bg); }
    .cp-dz-pin h4 { margin: 0; font-size: 0.98rem; }
    .cp-dz-pin .beats { margin: 6px 0 0; padding-left: 18px; font-size: 0.84rem; }

    /* plate badge */
    .cp-badge-head { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
    .cp-badge-head:hover { transform: translateY(-2px); transition: transform .15s ease; }
    .cp-badge-svg { width: 76px; height: 48px; flex: 0 0 auto; }
    .cp-badge-meta .lvl { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; line-height: 1; }
    .cp-badge-meta .nm { color: var(--muted); font-size: 0.82rem; font-weight: 700; margin-top: 2px; }
    .cp-plate { transform-origin: center; }
    .cp-level-row { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 16px; margin-top: 10px; }
    .cp-level-row.locked { opacity: .55; }
    .cp-level-row .lr-svg { width: 92px; height: 56px; flex: 0 0 auto; }
    .cp-level-row h4 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 1.1rem; }
    .cp-level-row .lr-req { color: var(--accent); font-size: 0.78rem; font-weight: 800; margin-top: 2px; }
    .cp-level-row p { color: var(--muted); font-size: 0.86rem; line-height: 1.4; margin: 6px 0 0; }

    /* ============ v5: full-bleed title screens (intros + path chooser) ============ */
    @keyframes cpRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes cpDrift { 0% { transform: translate(-10%, -6%) scale(1); } 50% { transform: translate(10%, 8%) scale(1.18); } 100% { transform: translate(-10%, -6%) scale(1); } }
    .cp-ambient { position: fixed; inset: -20%; z-index: 0; pointer-events: none; background: radial-gradient(38% 38% at 32% 30%, rgba(197, 141, 79, 0.22), transparent 70%); animation: cpDrift 20s ease-in-out infinite; }
    .cp-title { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; min-height: calc(100dvh - var(--navbar-height, 72px) - 80px); padding: 0 6px; }
    .cp-title .cp-seclabel { font-size: 0.74rem; }
